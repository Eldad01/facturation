services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturation_app_test
    ports:
      - "8081:80"
    environment:
      APP_NAME: Facturation
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: facturation
      DB_USERNAME: postgres
      DB_PASSWORD: ""

      LOG_CHANNEL: stack
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: facturation_db_test
    environment:
      POSTGRES_DB: facturation
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

    volumes:
      - facturation_pgdata_test:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facturation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  facturation_pgdata_test: